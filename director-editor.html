<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>导播画面 · 拖拽定位编辑器</title>
<link rel="stylesheet" href="css/director.css?v=5">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #060b16; color: #eef3fb;
    font-family: system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }

  .ed-topbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; background: #0d1730; border-bottom: 1px solid rgba(212,180,122,.2);
    position: sticky; top: 0; z-index: 20;
  }
  .ed-topbar__title { font-weight: 900; font-size: 15px; color: #e8cf9e; }
  .ed-topbar select {
    padding: 8px 12px; border-radius: 8px; background: #14224a;
    border: 1px solid rgba(212,180,122,.4); color: #fff; font: inherit; font-size: 13px;
  }
  .ed-btn {
    padding: 8px 16px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 800;
    cursor: pointer; border: 1px solid transparent;
  }
  .ed-btn--primary { background: linear-gradient(135deg,#e8cf9e,#b8995c); color: #0d1730; }
  .ed-btn--ghost { background: rgba(255,255,255,.06); border-color: rgba(212,180,122,.4); color: #e8cf9e; }
  .ed-coord { margin-left: auto; font-size: 12px; color: #9fb2d0; font-family: ui-monospace,Menlo,monospace; }
  .ed-hint { font-size: 12px; color: #8fa0bd; }

  .ed-wrap { display: flex; justify-content: center; padding: 24px 16px; }
  .ed-canvas {
    position: relative; width: min(92vw, 1280px); aspect-ratio: 16 / 9;
    background: #000; border: 1px solid rgba(212,180,122,.35); border-radius: 6px; overflow: hidden;
    touch-action: none;
  }
  .ed-canvas__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .ed-grid {
    position: absolute; inset: 0; pointer-events: none; opacity: .25;
    background-image: linear-gradient(rgba(127,184,255,.4) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(127,184,255,.4) 1px, transparent 1px);
    background-size: 10% 10%; z-index: 1;
  }
  .ed-node {
    position: absolute; transform: translate(-50%,-50%); cursor: move; z-index: 5;
    user-select: none; touch-action: none;
  }
  .ed-node--team {
    font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 2px;
    padding: 8px 18px; background: rgba(6,12,28,.6); border: 2px solid rgba(212,180,122,.55);
    border-radius: 10px; backdrop-filter: blur(3px); text-shadow: 0 2px 8px rgba(0,0,0,.9);
  }
  .ed-node--row {
    display: flex; align-items: flex-start; justify-content: center; gap: 40px;
    padding: 12px 22px; background: rgba(10,20,42,.4); border: 2px dashed rgba(127,184,255,.7);
    border-radius: 12px; white-space: nowrap;
  }
  .ed-node--row.is-judge { gap: 20px; }
  .ed-person { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ed-avatar { width: var(--ed-av, 72px); height: var(--ed-av, 72px); border-radius: 50%; background: rgba(20,32,64,.6);
    border: 3px solid rgba(212,180,122,.85); display: grid; place-items: center; font-size: 26px; color: #b9c6e0; }
  .ed-pname { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
  .ed-av { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9fb2d0; }
  .ed-av input[type="range"] { width: 110px; accent-color: #e8cf9e; }
  .ed-av b { color: #e8cf9e; font-family: ui-monospace, Menlo, monospace; }
  .ed-legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 8;
    font-size: 11px; color: #9fb2d0; background: rgba(6,10,22,.55);
    padding: 4px 8px; border-radius: 6px; pointer-events: none;
  }
</style>
</head>
<body>

<div class="ed-topbar">
  <span class="ed-topbar__title">🎛 拖拽定位编辑器</span>
  <select id="edType">
    <option value="starting">封面 · 即将开始</option>
    <option value="staff">解说席</option>
  </select>
  <div class="ed-av" id="edAvWrap" style="display:none">
    <label for="edAv">解说头像大小</label>
    <input type="range" id="edAv" min="6" max="22" step="0.5" value="12">
    <b id="edAvVal">12vh</b>
  </div>
  <button class="ed-btn ed-btn--primary" id="edSave">💾 保存位置</button>
  <button class="ed-btn ed-btn--ghost" id="edReset">↺ 重置该画面</button>
  <span class="ed-coord" id="edCoord">拖动元素，实时显示坐标</span>
</div>
<div class="ed-hint" style="padding:6px 18px;">直接拖动下面的元素到你想要的位置，点「保存位置」即可。导播画面会记住并自动套用。坐标 = 相对画布宽高的百分比。</div>

<div class="ed-wrap">
  <div class="ed-canvas" id="edCanvas"></div>
</div>

<script type="module" src="js/director-editor.js?v=3"></script>
</body>
</html>
